<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Book</title>
<meta name="description" content="Turn photos into a design system and a sample site.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceeeb;--panel:#dfe2de;--ink:#15191c;--muted:#51585d;--accent:#2a3fb3;--accent-ink:#ffffff;--warn:#9c2f22;--good:#2b6637;--rule:#c3c8c3;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181b1d;--panel:#23282b;--ink:#eceeeb;--muted:#a6adb1;--accent:#a9b6ff;--accent-ink:#11152e;--warn:#ff9b8f;--good:#93d39f;--rule:#394145;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181b1d;--panel:#23282b;--ink:#eceeeb;--muted:#a6adb1;--accent:#a9b6ff;--accent-ink:#11152e;--warn:#ff9b8f;--good:#93d39f;--rule:#394145;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:1180px;margin:0 auto;padding:20px clamp(16px,4vw,40px) 64px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:6px 0 26px;flex-wrap:wrap}
.t-title{font:400 clamp(34px,5vw,50px)/1.02 "Young Serif",Georgia,serif;margin:0 0 6px}
.t-h2{font:700 17px/1.3 "Schibsted Grotesk",system-ui,sans-serif;margin:0 0 8px}
.bar p{margin:0}
.muted{color:var(--muted)}.sm{font-size:14px}.pad{padding:30px 0}
.t-btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:700 15px/1.1 "Schibsted Grotesk",system-ui,sans-serif;padding:14px 20px;min-height:46px;cursor:pointer;border-radius:3px;transition:filter .15s ease,background-color .15s ease}
.t-btn:disabled{opacity:.45;cursor:default}
.t-btn:not(:disabled):not(.ghost):not(.danger):hover{filter:brightness(.9)}
.t-btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.t-btn.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.t-btn.ghost:not(:disabled):hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.t-btn.danger:not(:disabled):hover{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.back{appearance:none;border:0;background:none;color:var(--ink);font:600 15px/1 "Schibsted Grotesk",system-ui,sans-serif;padding:12px 0;cursor:pointer}
.back::before{content:"‹";margin-right:6px;font-size:18px}
.back:hover{text-decoration:underline}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:34px 24px}
.card{all:unset;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.cover{position:relative;aspect-ratio:4/3;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}
.cv-blocks{position:absolute;top:20px;right:20px;left:46%;bottom:42%;display:flex;gap:8px}
.cv-blocks i{flex:1;display:block}.cv-blocks i:nth-child(2){flex:1.7}
.cv-name{position:relative;font-size:clamp(30px,3.4vw,40px);line-height:.95;max-width:78%;overflow-wrap:anywhere}
.card:hover .cv-name{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.meta{display:flex;flex-direction:column;gap:7px}.tl{font-size:15px;line-height:1.4}
.thumbs{display:flex;gap:4px}.thumbs img{width:34px;height:34px;object-fit:cover;display:block}
.empty{padding:40px 0;max-width:560px}.empty h2{font:400 28px/1.15 "Young Serif",Georgia,serif;margin:0 0 10px}.empty p{margin:0 0 20px;color:var(--muted)}
.step{margin:26px 0;max-width:820px}.step p{margin:0}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin-top:14px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph-img{all:unset;cursor:pointer;display:block;aspect-ratio:1;transition:box-shadow .15s ease}
.ph-img:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.ph:not(.is-anchor) .ph-img:hover{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--muted)}
.ph.is-anchor .ph-img{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.ph-cap{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}
.ph.is-anchor .ph-cap span{color:var(--ink);font-weight:700}
.x{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:13px}
.x:hover{color:var(--ink)}
.x:focus-visible{outline:2px solid var(--accent)}
.drop{display:grid;place-items:center;aspect-ratio:1;background:var(--panel);cursor:pointer;font-weight:700;position:relative;text-align:center;padding:8px;transition:filter .15s ease}
.drop:hover{filter:brightness(.96)}
.urlrow{display:flex;gap:8px;margin-top:12px;max-width:520px}
.urlrow input{flex:1;background:var(--panel);border:0;color:var(--ink);font:inherit;padding:12px 14px;border-radius:3px;min-width:0}
.urlrow input::placeholder{color:var(--muted)}
.urlrow .t-btn{padding:0 18px;min-height:auto}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:3px}
textarea{width:100%;background:var(--panel);border:0;color:var(--ink);font:inherit;padding:14px;border-radius:3px;resize:vertical;margin-top:10px}
textarea::placeholder{color:var(--muted)}
.warn{color:var(--warn)}.ok-note{color:var(--good);margin:0 0 12px}
.prog{background:var(--panel);padding:18px 20px;margin-top:8px;max-width:520px}
.prog-head{margin:0 0 14px;font:700 17px/1.3 "Schibsted Grotesk",system-ui,sans-serif}
.prog-bar{height:6px;background:var(--rule);margin-bottom:14px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);width:6%;transition:width .6s ease}
.prog p{margin:0 0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ent-h{margin:0 0 14px}.ent-name{font-size:clamp(42px,7vw,76px);line-height:.95;margin:0 0 12px;overflow-wrap:anywhere}.ent-h p{margin:0 0 4px;max-width:70ch}
.segs{display:inline-flex;background:var(--panel);padding:3px;gap:2px;border-radius:3px;flex-wrap:wrap}
.seg{all:unset;cursor:pointer;padding:9px 13px;font-size:14px;font-weight:700;color:var(--muted);border-radius:2px}
.seg.on{background:var(--bg);color:var(--ink)}.seg:focus-visible{outline:2px solid var(--accent)}
.tabs{display:flex;gap:2px;margin:6px 0 16px;overflow-x:auto;box-shadow:inset 0 -1px var(--rule)}
.tab{all:unset;cursor:pointer;padding:12px 14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px var(--accent)}.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.frame{overflow:hidden;background:var(--panel)}
.frame iframe{display:block;border:0;width:100%;height:900px;background:#fff}
.revise{margin-top:30px;max-width:720px}.revise p{margin:0}.revise textarea{margin:12px 0 14px}
.method section{margin:0 0 32px;max-width:780px}.method p{margin:0 0 8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%}
.checks .bad::before{background:var(--warn)}.checks .good::before{background:var(--good)}
.mrow{display:grid;grid-template-columns:72px 1fr;gap:14px;margin-bottom:16px}.mrow img,.nothumb{width:72px;height:72px;object-fit:cover;background:var(--panel);display:block}.mrow p{margin:2px 0}
.words{font:400 21px/1.35 "Young Serif",Georgia,serif}
.faces{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:12px 0 0}.faces dt{color:var(--muted);text-transform:capitalize}.faces dd{margin:0}
.quote{font:400 19px/1.45 "Young Serif",Georgia,serif}
.changes{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:14px}.changes li{display:grid;gap:3px}
.was{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.rules{padding-left:20px;margin:0}.rules li{margin:5px 0}
.exports{display:grid;gap:28px;max-width:720px}.ex p{margin:0 0 12px;color:var(--muted)}
.xout{white-space:pre-wrap;word-break:break-all;background:var(--panel);padding:14px;font-size:12px;max-height:360px;overflow:auto;margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:820px}.fields label{display:block;font-weight:700;font-size:15px}.fields input{width:100%;margin-top:8px;background:var(--panel);border:0;color:var(--ink);font:inherit;padding:13px 14px;border-radius:3px}
@media (max-width:560px){.bar .t-btn{width:100%}}
</style><style id="dyn"></style></head><body><div id="app"></div>
<script type="module" src="/js/app.js"></script>
</body></html>
