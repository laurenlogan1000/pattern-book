# Cloudflare Pages configuration. Secrets (ANTHROPIC_API_KEY, APP_PASSCODE) are NOT set here:
# add them in the Cloudflare dashboard or with `npx wrangler pages secret put`.
name = "pattern-book"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "pattern-book"
database_id = "669a4531-2f0d-4adf-8c31-75589773ddb2"

[vars]
MODEL = "claude-opus-5-5"
MAX_TOKENS = "32000"
RUNS_PER_HOUR = "20"
RUNS_PER_DAY = "200"
